# 自动发版（docs/RELEASE.md）：推送与 project.yml 的 MARKETING_VERSION 一致的 tag `v<版本>`，
# 本 job 跑单元测试 → archive → Developer ID 签名 → 公证 → staple → Sparkle 签名 →
# 发布 GitHub Release（Pier-<版本>.zip + appcast.xml）。
#
# 仓库 secrets：
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 — App Store Connect API key（Admin，.p8 原文），用于公证
#   MAC_CERT_P12 / MAC_CERT_PASSWORD        — 经典 Developer ID Application 证书（.p12 的 base64 + 密码）
#   SPARKLE_ED_PRIVATE_KEY                  — Sparkle EdDSA 私钥（generate_keys -x 导出，与 Inbox 同一把）
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与版本号一致
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME ≠ project.yml $VERSION"; exit 1; }

      - name: 选用最新的 Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          brew install xcodegen

      - name: 单元测试
        run: cd Packages/PierKit && swift test

      - name: 导入 Developer ID 证书
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 构建、公证、staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          scripts/release.sh

      - name: Sparkle 签名 + appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/make_appcast.sh

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/release/Pier-*.zip build/release/appcast.xml \
            --title "Pier $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
