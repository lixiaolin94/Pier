# 用 xcodegen 生成 Pier.xcodeproj：xcodegen generate
# 源码目录是"同步文件夹"，增删 Swift 文件不需要重新生成工程；只有改了本文件才需要。
name: Pier
options:
  bundleIdPrefix: work.xiaolin
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PierKit:
    path: Packages/PierKit
  # 应用内自动更新（docs/RELEASE.md）。只链 App target，PierKit 保持零依赖；
  # 代码用 `#if canImport(Sparkle) && !DEBUG` 包住，Debug 构建不含更新器。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
targets:
  Pier:
    type: application
    platform: macOS
    sources:
      - path: Pier
        type: syncedFolder
    dependencies:
      - package: PierKit
      - package: Sparkle
    info:
      # 不放在 Pier/ 下：那是同步文件夹，Info.plist 会被当成资源拷进包里
      path: Config/Info.plist
      properties:
        # Sparkle feed 跟随最新的 GitHub Release，每个 release 只带自己那一条
        SUFeedURL: https://github.com/lixiaolin94/Pier/releases/latest/download/appcast.xml
        # 与 Inbox 共用同一把 EdDSA 密钥（私钥在登录钥匙串 + CI secret SPARKLE_ED_PRIVATE_KEY）
        SUPublicEDKey: "eaPIgZ2aNcGGEWHZVbVc1rmaP1jKoX4inFv+5k79TpA="
        # 个人工具：按计划自动检查，不弹第二次启动时的询问框
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.xiaolin.Pier
        PRODUCT_NAME: Pier
        # 版本规则见 docs/RELEASE.md：只递增最后一位，0.1.1 → 0.1.2 → …
        MARKETING_VERSION: "0.1.2"
        # CFBundleVersion 跟随版本号：Sparkle 用它比较新旧，每次发版都必须增长
        CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pier
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Xiaolin"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Pier/Resources/Pier.entitlements
        # Debug 用 Apple Development 证书：签名身份每次构建都一样，macOS 的「允许配件连接」只问一次
        # （ad-hoc 签名每次构建都变，系统会当成新 app 反复询问）。Release 用 Developer ID。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: YWQ4TY4VR5
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
schemes:
  Pier:
    build:
      targets:
        Pier: all
    run:
      config: Debug
    test:
      config: Debug
