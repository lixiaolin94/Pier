# 用 xcodegen 生成 Pier.xcodeproj：xcodegen generate
# 源码目录是"同步文件夹"，增删 Swift 文件不需要重新生成工程；只有改了本文件才需要。
name: Pier
options:
  bundleIdPrefix: work.xiaolin
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PierKit:
    path: Packages/PierKit
targets:
  Pier:
    type: application
    platform: macOS
    sources:
      - path: Pier
        type: syncedFolder
    dependencies:
      - package: PierKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.xiaolin.Pier
        PRODUCT_NAME: Pier
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pier
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Xiaolin"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Pier/Resources/Pier.entitlements
        # 本地开发先用 ad-hoc 签名；要分发时在 Xcode 里选自己的 Team
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  Pier:
    build:
      targets:
        Pier: all
    run:
      config: Debug
    test:
      config: Debug
